# Burn CPU in every app container for 3 minutes. Pods have no CPU limit, so
# this shows whether requests (100m) are enough to protect latency on a busy node.
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: app-cpu-stress
  namespace: payments
spec:
  mode: all
  selector:
    namespaces: [payments]
    labelSelectors: { app: payments-api }
  stressors:
    cpu:
      workers: 2
      load: 90
  duration: 3m
