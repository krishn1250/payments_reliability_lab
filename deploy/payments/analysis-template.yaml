# What "healthy" means for a canary. Thresholds match the SLOs in ADR 0002.
# canary-hash is filled in by the Rollout (podTemplateHashValue: Latest), so
# queries only look at pods running the new version.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: canary-health
spec:
  args:
    - name: canary-hash
    - name: prometheus
      value: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
  metrics:
    - name: success-rate
      initialDelay: 30s     # rate() over 1m needs a few scrapes first
      interval: 30s
      failureLimit: 1       # 2 failed checks -> abort
      successCondition: len(result) > 0 && result[0] >= 0.99
      provider:
        prometheus:
          address: "{{args.prometheus}}"
          query: |
            sum(rate(http_requests_total{namespace="payments", app="payments-api", revision="{{args.canary-hash}}", status!~"5.."}[1m]))
            /
            sum(rate(http_requests_total{namespace="payments", app="payments-api", revision="{{args.canary-hash}}"}[1m]))

    - name: p95-latency-seconds
      initialDelay: 30s
      interval: 30s
      failureLimit: 1
      successCondition: len(result) > 0 && result[0] < 0.3
      provider:
        prometheus:
          address: "{{args.prometheus}}"
          query: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{namespace="payments", app="payments-api", revision="{{args.canary-hash}}"}[1m])))

    # A canary must never be promoted while it can't reach the database:
    # unrecovered DB errors on canary pods fail the analysis too.
    - name: unrecovered-db-errors
      initialDelay: 30s
      interval: 30s
      failureLimit: 1
      successCondition: len(result) == 0 || result[0] < 1
      provider:
        prometheus:
          address: "{{args.prometheus}}"
          query: sum(increase(payments_db_errors_total{namespace="payments", app="payments-api", revision="{{args.canary-hash}}"}[1m]))
