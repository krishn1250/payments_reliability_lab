apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payments-api
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: payments-api
  strategy:
    canary:
      stableService: payments-api-stable
      canaryService: payments-api-canary
      maxUnavailable: 0
      maxSurge: 1
      # Background analysis runs from step 1 until the rollout finishes.
      # Two failed measurements in a row -> abort -> scale canary to 0.
      analysis:
        startingStep: 1
        templates:
          - templateName: canary-health
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 25        # 1 of 4 pods on the new version
        - pause: { duration: 2m }
        - setWeight: 50
        - pause: { duration: 2m }
        - setWeight: 75
        - pause: { duration: 2m }
        # 100% after the last step
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: payments-api }
      containers:
        - name: payments-api
          image: payments-api:0.1.0   # built locally and loaded with `make image`
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          env:
            # --- release knobs: change these with `make release` (via Git) ---
            - name: APP_VERSION
              value: "v1"                   # release:version
            - name: RELEASE_FAULT_RATE
              value: "0"                    # release:fault
            - name: RELEASE_EXTRA_LATENCY_MS
              value: "0"                    # release:latency
            # ------------------------------------------------------------------
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: payments-db-app     # generated by CloudNativePG
                  key: uri
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: payments-webhook    # created by `make secrets`
                  key: secret
            - name: DB_POOL_MAX
              value: "10"
            # --- OpenTelemetry ---
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: OTEL_SERVICE_NAME
              value: payments-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc:4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=payments,k8s.pod.name=$(POD_NAME)
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 60      # schema init can wait out a DB failover
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payments-api
spec:
  minAvailable: 3
  selector:
    matchLabels: { app: payments-api }
