apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payments
resources:
  - database.yaml
  - services.yaml
  - rollout.yaml
  - analysis-template.yaml
  - podmonitor.yaml
  - network-policies.yaml
  - loadgen.yaml
configMapGenerator:
  - name: loadgen-script
    files:
      - loadgen.js
generatorOptions:
  disableNameSuffixHash: true
