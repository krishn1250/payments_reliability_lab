# The workload. Last wave: needs CNPG, Rollouts and Prometheus CRDs first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/payments-reliability-lab.git
    targetRevision: main
    path: deploy/payments
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
  # Rollouts mutates the canary/stable Service selectors; don't fight it.
  ignoreDifferences:
    - kind: Service
      jsonPointers:
        - /spec/selector
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
